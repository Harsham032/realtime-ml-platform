# Alerting rules.
#
# Ordered by how early each fires. Prediction drift moves within minutes;
# precision regressions only surface once investigations close, days later.
# That gap is the whole reason the leading indicators are alerted on.

groups:
  - name: rtml-serving
    rules:
      - alert: ScoringLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(rtml_scoring_latency_seconds_bucket[5m])) by (le)) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: 95th percentile scoring latency above 50ms
          description: >-
            The streaming consumer scores each event as it arrives, so latency
            here translates directly into consumer lag.

      - alert: ScoringServiceDown
        expr: up{job="rtml"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: The scoring service is not responding to scrapes

  - name: rtml-model-health
    rules:
      - alert: AlertVolumeSpike
        expr: |
          (sum(rate(rtml_alerts_total[30m])) / clamp_min(sum(rate(rtml_transactions_scored_total[30m])), 1e-9)) > 0.05
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: More than 5 percent of transactions are alerting
          description: >-
            The investigation queue is sized for roughly 0.5 percent. A tenfold
            increase usually means prediction drift or a bad threshold, not a
            tenfold increase in fraud.

      - alert: AlertVolumeCollapsed
        expr: |
          (sum(rate(rtml_alerts_total[1h])) / clamp_min(sum(rate(rtml_transactions_scored_total[1h])), 1e-9)) < 0.0005
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: Alert volume has collapsed
          description: >-
            A model scoring everything low is indistinguishable from a quiet
            day until the chargebacks arrive. Check the score distribution.

      - alert: ScoreDistributionShifted
        expr: |
          abs(
            histogram_quantile(0.95, sum(rate(rtml_score_distribution_bucket[1h])) by (le))
            - histogram_quantile(0.95, sum(rate(rtml_score_distribution_bucket[24h])) by (le))
          ) > 0.2
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: The score distribution has moved against its own daily baseline
          description: >-
            Prediction drift. Leads a measured precision regression by however
            long the investigation queue takes to close cases.
