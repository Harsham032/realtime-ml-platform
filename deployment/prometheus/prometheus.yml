# Scrape configuration for the scoring service.
#
# Four families matter operationally:
#   rtml_transactions_scored_total  - throughput
#   rtml_alerts_total               - investigation queue volume
#   rtml_scoring_latency_seconds    - the service level
#   rtml_score_distribution         - prediction drift, the leading indicator
#                                     that moves before labels arrive

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rtml
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
