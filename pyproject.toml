[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtml"
version = "0.1.0"
description = "Streaming machine learning platform for real-time transaction risk scoring with feature pipelines, model tracking and drift monitoring."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "harsham032" }]
keywords = ["fraud-detection", "streaming", "mlops", "drift-detection", "imbalanced-classification"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "joblib>=1.3",
    "pyarrow>=15.0",
    "mlflow>=2.12",
    "kafka-python>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "SQLAlchemy>=2.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
cache = ["redis>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/Harsham032/realtime-ml-platform"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rtml = ["py.typed", "data/sql/*.sql"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
# E501: line length is black's job.
# B008: FastAPI dependency defaults are call expressions by design.
# N803/N806: `X` for a feature matrix is the scikit-learn convention; renaming it
# to satisfy PEP 8 would make the code harder to read, not easier.
ignore = ["E501", "B008", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]
"scripts/*" = ["T201"]
"examples/*" = ["T201"]
# The lifespan signature is fixed by the framework.
"src/rtml/services/api.py" = ["ARG001"]

[tool.mypy]
python_version = "3.11"
packages = ["rtml"]
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests taking more than a few seconds",
    "kafka: tests requiring a reachable Kafka broker (deselected by default)",
]

[tool.coverage.run]
source = ["src/rtml"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
