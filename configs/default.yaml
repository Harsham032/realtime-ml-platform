# Default pipeline configuration. Override on the command line with
# --set key=value, or through RTML_* environment variables for deployment.

run:
  name: default
  seed: 20260101
  output_dir: reports

simulation:
  # Produces roughly 1.8 million transactions at a fraud rate near 0.8 percent.
  n_customers: 5000
  n_terminals: 10000
  n_days: 183
  start_date: "2025-01-01"
  radius: 5.0

split:
  # Temporal, with a delay period between train and test representing the time
  # fraud labels take to arrive. See docs/methodology.md.
  train_days: 112
  delay_days: 7
  test_days: 56
  validation_days: 14

features:
  customer_windows: [1, 7, 30]
  terminal_windows: [1, 7, 30]
  risk_delay_days: 7
  night_start_hour: 0
  night_end_hour: 6

models:
  enabled: [logistic_regression, random_forest, xgboost, lightgbm]
  class_weight: balanced
  logistic_regression: {C: 1.0, max_iter: 2000}
  random_forest: {n_estimators: 200, max_depth: 12, min_samples_leaf: 20}
  xgboost: {n_estimators: 300, max_depth: 6, learning_rate: 0.1, subsample: 0.8, colsample_bytree: 0.8}
  lightgbm: {n_estimators: 300, num_leaves: 31, learning_rate: 0.1, min_child_samples: 50}
  isolation_forest: {n_estimators: 150, contamination: auto}

evaluation:
  primary_metric: pr_auc
  top_k_per_day: 100
  threshold_objective: f1
  target_precision: 0.60
  target_recall: 0.60
  bootstrap_resamples: 1000

drift:
  psi_warn: 0.10
  psi_alert: 0.25
  ks_alert_pvalue: 0.01
  bins: 10
  reference_days: 14
  comparison_days: 7

promotion:
  min_pr_auc: 0.30
  min_pr_auc_improvement: 0.005
  max_latency_regression_ms: 5.0
  min_evaluation_frauds: 50
  require_calibration: true
  max_brier_regression: 0.002

streaming:
  backend: inprocess           # inprocess | kafka
  partitions: 4
  batch_size: 500
  poll_timeout_seconds: 1.0
  speedup: 0.0                 # 0 = replay as fast as possible
