name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: pytest --cov=rtml --cov-report=term-missing --cov-report=xml

      - name: Verify the package imports from an installed location
        # Catches a module that only resolves because the repository root is on
        # sys.path, which is how a packaged import usually breaks.
        run: |
          cd "${RUNNER_TEMP}"
          python -c "import rtml; print(rtml.__version__)"

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  pipeline:
    # The whole pipeline runs on every change, on the reduced configuration, so
    # a break in generation, training, streaming or drift cannot reach main
    # unnoticed. The published benchmark uses configs/default.yaml and is far
    # too large for a free runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate data
        run: python scripts/generate_data.py --config configs/fast.yaml

      - name: Train, track and gate a promotion
        run: python scripts/train.py --config configs/fast.yaml

      - name: Run the streaming path
        run: python scripts/run_stream.py --config configs/fast.yaml --write-database

      - name: Produce a drift report
        run: python scripts/drift_report.py --config configs/fast.yaml

      - name: Check the model registry recorded a champion
        run: |
          python - <<'PY'
          from rtml.models.registry import ModelRegistry
          registry = ModelRegistry("sqlite:///mlflow.db")
          champion = registry.get_alias_version("fraud-scorer", "champion")
          assert champion is not None, "training did not register a champion"
          print(f"champion version: {champion}")
          PY

      - name: Upload the reports
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: reports/
          retention-days: 30
